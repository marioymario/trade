services:
  event_risk:
    build:
      context: .
      dockerfile: docker/event_risk.Dockerfile
    image: trade-event-risk
    container_name: event_risk
    restart: "no"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: America/Los_Angeles
      EVENT_RISK_SOURCE: ${EVENT_RISK_SOURCE:-mock}
      EVENT_RISK_MANUAL_SOURCE_PATH: ${EVENT_RISK_MANUAL_SOURCE_PATH:-data/processed/event_risk/manual_current.json}
      EVENT_RISK_FILE_SOURCE_REFRESH_AS_OF_UTC: ${EVENT_RISK_FILE_SOURCE_REFRESH_AS_OF_UTC:-0}
      EVENT_RISK_STATUS: ${EVENT_RISK_STATUS:-ok}
      EVENT_RISK_LEVEL: ${EVENT_RISK_LEVEL:-normal}
      EVENT_RISK_NEWS_REGIME: ${EVENT_RISK_NEWS_REGIME:-calm}
      EVENT_RISK_SCORE: ${EVENT_RISK_SCORE:-0.1}
      EVENT_RISK_TTL_SECONDS: ${EVENT_RISK_TTL_SECONDS:-900}
      EVENT_RISK_REASON_CODES: ${EVENT_RISK_REASON_CODES:-}
      EVENT_RISK_SOURCE_COUNT: ${EVENT_RISK_SOURCE_COUNT:-1}

      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      EVENT_RISK_GUARDIAN_BASE_URL: ${EVENT_RISK_GUARDIAN_BASE_URL:-https://content.guardianapis.com/search}
      EVENT_RISK_GUARDIAN_QUERY: ${EVENT_RISK_GUARDIAN_QUERY:-geopolitics OR war OR conflict OR sanctions OR oil}
      EVENT_RISK_GUARDIAN_PAGE_SIZE: ${EVENT_RISK_GUARDIAN_PAGE_SIZE:-10}
      EVENT_RISK_GUARDIAN_LOOKBACK_HOURS: ${EVENT_RISK_GUARDIAN_LOOKBACK_HOURS:-24}
      EVENT_RISK_GUARDIAN_TTL_SECONDS: ${EVENT_RISK_GUARDIAN_TTL_SECONDS:-3600}

      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
      EVENT_RISK_NEWSDATA_BASE_URL: ${EVENT_RISK_NEWSDATA_BASE_URL:-https://newsdata.io/api/1/latest}
      EVENT_RISK_NEWSDATA_QUERY: ${EVENT_RISK_NEWSDATA_QUERY:-geopolitics OR war OR conflict OR sanctions OR oil}
      EVENT_RISK_NEWSDATA_LANGUAGE: ${EVENT_RISK_NEWSDATA_LANGUAGE:-en}
      EVENT_RISK_NEWSDATA_PAGE_SIZE: ${EVENT_RISK_NEWSDATA_PAGE_SIZE:-10}
      EVENT_RISK_NEWSDATA_LOOKBACK_HOURS: ${EVENT_RISK_NEWSDATA_LOOKBACK_HOURS:-24}
      EVENT_RISK_NEWSDATA_TTL_SECONDS: ${EVENT_RISK_NEWSDATA_TTL_SECONDS:-3600}

      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      EVENT_RISK_GNEWS_BASE_URL: ${EVENT_RISK_GNEWS_BASE_URL:-https://gnews.io/api/v4/search}
      EVENT_RISK_GNEWS_QUERY: ${EVENT_RISK_GNEWS_QUERY:-geopolitics OR war OR conflict OR sanctions OR oil}
      EVENT_RISK_GNEWS_LANGUAGE: ${EVENT_RISK_GNEWS_LANGUAGE:-en}
      EVENT_RISK_GNEWS_PAGE_SIZE: ${EVENT_RISK_GNEWS_PAGE_SIZE:-10}
      EVENT_RISK_GNEWS_LOOKBACK_HOURS: ${EVENT_RISK_GNEWS_LOOKBACK_HOURS:-24}
      EVENT_RISK_GNEWS_TTL_SECONDS: ${EVENT_RISK_GNEWS_TTL_SECONDS:-3600}

      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      EVENT_RISK_NEWSAPI_BASE_URL: ${EVENT_RISK_NEWSAPI_BASE_URL:-https://newsapi.org/v2/everything}
      EVENT_RISK_NEWSAPI_QUERY: ${EVENT_RISK_NEWSAPI_QUERY:-geopolitics OR war OR conflict OR sanctions OR oil}
      EVENT_RISK_NEWSAPI_LANGUAGE: ${EVENT_RISK_NEWSAPI_LANGUAGE:-en}
      EVENT_RISK_NEWSAPI_PAGE_SIZE: ${EVENT_RISK_NEWSAPI_PAGE_SIZE:-10}
      EVENT_RISK_NEWSAPI_LOOKBACK_HOURS: ${EVENT_RISK_NEWSAPI_LOOKBACK_HOURS:-24}
      EVENT_RISK_NEWSAPI_TTL_SECONDS: ${EVENT_RISK_NEWSAPI_TTL_SECONDS:-3600}

    working_dir: /work
    volumes:
      - ./files:/work/files
      - ./event_risk:/work/event_risk
      - ./data:/work/data
    command: python -m event_risk.main
